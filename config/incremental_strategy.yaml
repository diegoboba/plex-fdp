    priority_tables:
      # CRITICAL HIGH-VOLUME TABLES (33M+ rows) - Most aggressive incremental strategy
      asientos_detalle:
        # Hybrid: process lives in the parent (asientos), resolved via JOIN on IdAsiento (PK prefix).
        # Must run AFTER asientos in the same group: phase A is capped at the parent's max id in BQ
        # and phase B deletes every child row whose parent is not an auto process.
        strategy: "hybrid_process"
        id_column: "IdAsiento"
        parent_table: "asientos"
        process_column: "IdProcesoAsiento"
        auto_processes: [1, 5]
        id_margin: 20000
        auto_id_window: 20000        # ~50K detail rows per window
        manual_id_window: 1000000    # ~110K manual detail rows per window
        stale_ids_query: |
          -- auto asientos whose lines don't balance in BigQuery = born incomplete, finished later in MySQL
          SELECT d.IdAsiento
          FROM `{project}.{dataset}.plex_asientos_detalle` d
          JOIN `{project}.{dataset}.plex_asientos` a USING (IdAsiento)
          WHERE a.IdProcesoAsiento IN (1, 5)
          GROUP BY d.IdAsiento
          HAVING ABS(SUM(d.Debe) - SUM(d.Haber)) > 0.01
        chunk_size: 50000
        description: "43M rows, 3.9GB - Accounting entries detail - HIGHEST PRIORITY (hybrid, see asientos)"
        estimated_rows: 42968656
        
      factlineas:
        strategy: "date_incremental"
        watermark_column: ["Emision"]  # From factcabecera via JOIN
        chunk_size: 50000
        description: "13.5M rows, 3GB - Invoice line items - CRITICAL"
        estimated_rows: 13548813
        custom_query: |
          SELECT fl.* 
          FROM factlineas fl
          INNER JOIN factcabecera fc ON fl.IDComprobante = fc.IDComprobante 
          WHERE fc.Emision >= DATE_SUB(CURRENT_DATE(), INTERVAL {lookback_days} DAY)
        delete_condition: |
          WHERE IDComprobante IN (
            SELECT IDComprobante FROM `plex-etl-project.plex_analytics.plex_factcabecera` 
            WHERE Emision >= DATE_SUB(CURRENT_DATE(), INTERVAL {lookback_days} DAY)
          )
        
      asientos:
        # Hybrid (2026-09-29): FechaHora is NOT indexed and manual entries carry typed dates
        # (1977..2027), so date-based incremental was both slow and lossy.
        #  - IdProcesoAsiento 1 (facturas) + 5 (cobranzas) = 96.5% of rows, insert-only,
        #    IdAsiento chronological -> phase A reloads (max_auto_id - id_margin, max_id] by PK range
        #  - everything else (2, 3, 4, NULL ~615K rows) is deleted and reloaded in full every run
        strategy: "hybrid_process"
        id_column: "IdAsiento"
        process_column: "IdProcesoAsiento"
        auto_processes: [1, 5]
        id_margin: 20000             # ~2 days of ids; covers a run that died mid-load
        auto_id_window: 50000        # ids per MySQL query in phase A
        manual_id_window: 1000000    # ids per MySQL query in phase B (~35K manual rows each)
        stale_ids_query: |
          -- auto asientos whose lines don't balance in BigQuery = born incomplete, finished later in MySQL
          SELECT d.IdAsiento
          FROM `{project}.{dataset}.plex_asientos_detalle` d
          JOIN `{project}.{dataset}.plex_asientos` a USING (IdAsiento)
          WHERE a.IdProcesoAsiento IN (1, 5)
          GROUP BY d.IdAsiento
          HAVING ABS(SUM(d.Debe) - SUM(d.Haber)) > 0.01
        chunk_size: 50000
        description: "17.7M rows, 1.7GB - Accounting entries - CRITICAL (hybrid by IdProcesoAsiento)"
        estimated_rows: 17677482
        
