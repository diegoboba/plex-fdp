metadata:
  generated_at: "2025-01-25"
  version: "1.0"
  description: "Incremental ETL strategy configuration for Plex and Quantio databases"

# Runtime Parameters
runtime_parameters:
  lookback_days:
    description: "Number of days to look back for incremental processing"
    default_value: 3
    allowed_values: [1, 2, 3, 5, 7, 10, 15, 30]
    parameter_type: "integer"
    usage: "Controls DELETE and SELECT ranges for incremental tables"
    examples:
      daily_catch_up: 1
      normal_processing: 3
      weekly_catch_up: 7
      monthly_reprocess: 30
      
  dry_run:
    description: "Execute in dry-run mode (no actual data changes)"
    default_value: false
    parameter_type: "boolean"
    
  force_full_refresh:
    description: "Force full refresh for all tables (ignores incremental strategy)"
    default_value: false
    parameter_type: "boolean"
  
# Incremental strategy definitions
incremental_strategies:
  full_refresh:
    description: "Complete table reload every time"
    watermark_column: null
    filter_logic: null
    
  hybrid_process:
    description: "Insert-only processes by PK id range (phase A) + full reload of the edited/manual subset (phase B)"
    method: "id_range_plus_subset_reload"
    required_keys: [id_column, process_column, auto_processes]
    optional_keys: [parent_table, id_margin, auto_id_window, manual_id_window, stale_ids_query]
    used_by: [asientos, asientos_detalle]

  datetime_incremental:
    description: "DELETE last N days from BQ + INSERT last N days from MySQL"
    method: "delete_and_insert"
    default_lookback_days: 3
    configurable_lookback: true
    operation_sequence:
      1: "DELETE FROM BigQuery WHERE date_column >= DATE_SUB(CURRENT_DATE(), INTERVAL {lookback_days} DAY)"
      2: "SELECT FROM MySQL WHERE date_column >= DATE_SUB(CURRENT_DATE(), INTERVAL {lookback_days} DAY)"
      3: "INSERT INTO BigQuery"
    
  date_incremental:
    description: "DELETE last N days from BQ + INSERT last N days from MySQL"
    method: "delete_and_insert"
    default_lookback_days: 3
    configurable_lookback: true
    operation_sequence:
      1: "DELETE FROM BigQuery WHERE date_column >= DATE_SUB(CURRENT_DATE(), INTERVAL {lookback_days} DAY)"
      2: "SELECT FROM MySQL WHERE date_column >= DATE_SUB(CURRENT_DATE(), INTERVAL {lookback_days} DAY)"
      3: "INSERT INTO BigQuery"

  id_incremental:
    description: "Append-only using MAX(id_column) from BigQuery as watermark"
    method: "append_new_ids"
    operation_sequence:
      1: "SELECT MAX(id_column) FROM BigQuery table"
      2: "SELECT FROM MySQL WHERE id_column > max_id ORDER BY id_column"
      3: "APPEND INTO BigQuery"

